appId: com.workbuddy.app
productName: WorkBuddy

artifactName: WorkBuddy-Setup-${version}.${ext}

directories:
  output: dist

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - '**/better-sqlite3/**'
  - '**/*.node'

win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkBuddy
